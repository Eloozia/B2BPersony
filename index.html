<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projektivní úlohy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one calm task surface for the participant; no researcher controls. */
:root{
  --bg:#F1F1F4; --surface:#FFFFFF; --surface-2:#E7E7EE; --fg:#23232B; --muted:#62626F; --line:#D3D3DD;
  --accent:#4650C8; --accent-fg:#FFFFFF; --accent-soft:#DDE0FA;
  --q-yellow:#DECF78; --q-orange:#D98C5C; --axis:#D4714A; --note-pink:#F2D7F0; --note-blue:#C3D1F9; --note-fg:#23232B;
  --chip-bg:#FFFFFF; --chip-fg:#23232B;
  --font-display:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17171C; --surface:#22222B; --surface-2:#2D2D38; --fg:#ECECF2; --muted:#A3A3B3; --line:#3A3A47;
  --accent:#8E98FF; --accent-fg:#14141F; --accent-soft:#2F3260; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17171C; --surface:#22222B; --surface-2:#2D2D38; --fg:#ECECF2; --muted:#A3A3B3; --line:#3A3A47;
  --accent:#8E98FF; --accent-fg:#14141F; --accent-soft:#2F3260; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
.shell{max-width:1560px;margin:0 auto}
h1,h2{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(22px,2.4vw,30px);line-height:1.2;font-weight:600}
h2{font-size:18px;font-weight:600}
p{margin:0}.muted{color:var(--muted)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:600 15px var(--font-body);padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.big{font-size:17px;padding:14px 22px;border-radius:12px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.center{display:grid;justify-items:center;text-align:center;gap:18px;padding:9vh 0 4vh}
.center .lead{color:var(--muted);max-width:56ch}
.fld{display:grid;gap:5px;font-size:14px;color:var(--muted);text-align:left;width:min(320px,100%)}
.fld input,.center textarea{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.center textarea{max-width:640px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.eyebrow{font:600 13px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:22px}
.task-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:6px 0 16px}
.task-head h1{max-width:46ch}
.counter{font:600 15px var(--font-display);padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.counter.flash{animation:flash .5s}
@keyframes flash{30%{background:var(--accent-soft);border-color:var(--accent)}}
.task-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
.slots{display:flex;gap:10px}
.slot{width:84px;height:62px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;overflow:hidden;position:relative;background:transparent;padding:0;color:var(--muted);font:600 18px var(--font-display)}
.slot.full{border:2px solid var(--accent);background:var(--surface);cursor:pointer}
.slot img{width:100%;height:100%;object-fit:contain}
.img-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.img-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:800px){.img-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.img-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;aspect-ratio:4/3;border-radius:12px;background:var(--surface);border:3px solid transparent;box-shadow:0 0 0 1px var(--line);overflow:hidden;cursor:pointer;transition:opacity .15s}
.tile img{width:100%;height:100%;object-fit:contain;display:block}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tile.dim{opacity:.45}
.badge{position:absolute;left:8px;top:8px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font:700 16px var(--font-display);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.badge.sm{width:22px;height:22px;font-size:13px;left:4px;top:4px}
.zoom{position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:8px;border:0;background:rgba(20,20,30,.62);color:#fff;display:grid;place-items:center;opacity:0;cursor:zoom-in;padding:0}
.tile:hover .zoom,.zoom:focus-visible{opacity:1}
@media (hover:none){.zoom{opacity:1}}
.ph{display:grid;place-items:center;width:100%;height:100%;background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--surface) 10px 20px);color:var(--muted);font:600 24px var(--font-display)}
#lb{position:fixed;inset:0;z-index:50;background:rgba(10,10,16,.86);display:grid;place-items:center;padding:24px;cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#fff}
.mx-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,320px);gap:22px;align-items:start}
@media (max-width:900px){.mx-layout{grid-template-columns:1fr}.tray{order:-1}}
.mx-wrap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto auto auto;gap:14px 16px;align-items:center;width:min(100%,max(520px,calc(100vh - 150px)));margin:0 auto}
@media (max-width:640px){.mx-wrap{gap:8px;width:100%}}
.note{width:96px;aspect-ratio:1;display:grid;place-items:center;text-align:center;padding:8px;background:var(--note-pink);color:var(--note-fg);font:500 16px/1.2 var(--font-display);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.note.blue{background:var(--note-blue)}
@media (max-width:640px){.note{width:62px;font-size:11px;padding:4px}}
.n-top{grid-area:1/2;justify-self:center}.n-left{grid-area:2/1}.n-right{grid-area:2/3}.n-bottom{grid-area:3/2;justify-self:center}
.mx{grid-area:2/2;position:relative;aspect-ratio:1;width:100%}
.mx-bg{position:absolute;inset:0;display:grid;grid:1fr 1fr/1fr 1fr;border-radius:18px;overflow:hidden}
.q{background-image:linear-gradient(rgba(255,255,255,.55) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.55) 1px,transparent 1px);background-size:33.333% 33.333%}
.q.y{background-color:var(--q-yellow)}.q.o{background-color:var(--q-orange)}
.ax-v,.ax-h{position:absolute;background:var(--axis);pointer-events:none;z-index:1}
.ax-v{left:50%;top:-3.5%;bottom:-3.5%;width:1.1%;min-width:7px;transform:translateX(-50%)}
.ax-h{top:50%;left:-3.5%;right:-3.5%;height:1.1%;min-height:7px;transform:translateY(-50%)}
.mx.over,.tray.over{outline:3px dashed var(--accent);outline-offset:4px}
.tray{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;align-content:start;min-height:160px}
.tray-list{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--chip-bg);color:var(--chip-fg);font:600 14px/1.2 var(--font-body);box-shadow:0 1px 3px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.1);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;max-width:170px;text-align:left}
.chip img{width:24px;height:24px;object-fit:contain;flex:none}
.chip.sel{outline:3px solid var(--accent);outline-offset:2px}
.chip.on-mx{position:absolute;transform:translate(-50%,-50%);z-index:3;width:max-content}
.chip.lifting{opacity:.25}
.chip.ghost{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:1000;cursor:grabbing;box-shadow:0 10px 26px rgba(0,0,0,.35)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<div class="shell"><main id="view"></main></div>
<div id="lb" hidden></div>
<div id="toast" hidden></div>

<script>
(()=>{
'use strict';
const CFG={"labels": {"top": "více užitečné", "bottom": "méně užitečné", "left": "méně důvěryhodné", "right": "více důvěryhodné"}, "pickCount": 3, "shuffle": true, "introStart": "", "introImages": "", "introMatrix": "", "images": [], "sources": []};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const r3=v=>Math.round(v*1000)/1000;
const L=CFG.labels;
const imgs=(CFG.images&&CFG.images.length)?CFG.images:Array.from({length:21},(_,i)=>({id:'ph'+(i+1),name:'Obrázek '+(i+1)}));
const srcs=(CFG.sources&&CFG.sources.length)?CFG.sources:Array.from({length:8},(_,i)=>({id:'ps'+(i+1),name:'Zdroj '+(i+1)}));
const K=CFG.pickCount||3;
const WORDS={1:'jeden obrázek',2:'dva obrázky',3:'tři obrázky',4:'čtyři obrázky'};
const introImg=(CFG.introImages||'').trim()||('Vyberte '+(WORDS[K]||(K+' obrázků'))+' z nabídky.');
const introMx=(CFG.introMatrix||'').trim()||'Umístěte informační zdroje do matice podle toho, jak jsou pro vás užitečné a důvěryhodné.';
const introStart=(CFG.introStart||'').trim()||'Čekají vás dvě krátké úlohy. Neexistují správné ani špatné odpovědi, zajímá nás váš pohled.';
const S={code:'',picks:[],placements:{},createdAt:Date.now(),finishedAt:null,
  imgOrder:CFG.shuffle!==false?shuf(imgs.map(x=>x.id)):imgs.map(x=>x.id),
  srcOrder:CFG.shuffle!==false?shuf(srcs.map(x=>x.id)):srcs.map(x=>x.id)};
let view='start',selChip=null,suppressClick=false,dlNS=null,drag=null;

function ordered(list,order){const m=new Map(list.map(x=>[x.id,x])),out=[];order.forEach(id=>{if(m.has(id)){out.push(m.get(id));m.delete(id)}});m.forEach(v=>out.push(v));return out}
function thumb(id){
  const i=imgs.findIndex(x=>x.id===id);
  if(i>=0&&imgs[i].src)return '<img src="'+esc(imgs[i].src)+'" alt="" draggable="false">';
  const m=/^ph(\d+)$/.exec(id);return '<div class="ph">'+(m?m[1]:(i>=0?i+1:'?'))+'</div>';
}
const srcLogo=id=>{const x=srcs.find(z=>z.id===id);return x&&x.src?x.src:''};
function chipHTML(o,x,y,sel){
  const on=x!=null;
  return '<div class="chip'+(on?' on-mx':'')+(sel?' sel':'')+'" data-chip="'+esc(o.id)+'" tabindex="0" role="button"'+(on?' style="left:'+x*100+'%;top:'+y*100+'%"':'')+'>'
    +(srcLogo(o.id)?'<img src="'+esc(srcLogo(o.id))+'" alt="" draggable="false">':'')+'<span>'+esc(o.name)+'</span></div>';
}
function matrixHTML(){
  const pl=S.placements;
  const chips=Object.keys(pl).map(id=>chipHTML({id,name:pl[id].name},pl[id].x,pl[id].y,selChip===id)).join('');
  return '<div class="mx-wrap"><div class="note n-top">'+esc(L.top)+'</div><div class="note blue n-left">'+esc(L.left)+'</div>'
    +'<div class="mx" id="mx"><div class="mx-bg"><i class="q y"></i><i class="q o"></i><i class="q o"></i><i class="q y"></i></div><i class="ax-v"></i><i class="ax-h"></i>'+chips+'</div>'
    +'<div class="note blue n-right">'+esc(L.right)+'</div><div class="note n-bottom">'+esc(L.bottom)+'</div></div>';
}
const resultObj=()=>({format:'projektivne-techniky/1',code:S.code,createdAt:S.createdAt,finishedAt:S.finishedAt,picks:S.picks,placements:S.placements,imgOrder:S.imgOrder,srcOrder:S.srcOrder});

function viewStart(){
  return '<section class="center"><h1>Vítejte</h1><p class="lead">'+esc(introStart)+'</p>'
    +'<label class="fld">Kód účastníka (pokud jste ho dostali)<input id="code" type="text" maxlength="40" autocomplete="off" value="'+esc(S.code)+'"></label>'
    +'<button class="btn primary big" data-act="start">Začít</button></section>';
}
function viewImages(){
  const list=ordered(imgs,S.imgOrder),full=S.picks.length>=K;
  const tiles=list.map(im=>{
    const idx=S.picks.findIndex(p=>p.id===im.id),sel=idx>=0;
    return '<div class="tile'+(sel?' sel':'')+(!sel&&full?' dim':'')+'" data-img="'+esc(im.id)+'" tabindex="0" role="button" aria-pressed="'+sel+'" aria-label="'+esc(im.name)+'">'+thumb(im.id)
      +(sel?'<span class="badge">'+(idx+1)+'</span>':'')
      +(im.src?'<button class="zoom" data-zoom="'+esc(im.id)+'" aria-label="Zvětšit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10" cy="10" r="6"/><path d="M15 15l5 5"/></svg></button>':'')+'</div>';
  }).join('');
  const slots=Array.from({length:K},(_,i)=>{const p=S.picks[i];
    return p?'<button class="slot full" data-unpick="'+esc(p.id)+'" title="Zrušit výběr">'+thumb(p.id)+'<span class="badge sm">'+(i+1)+'</span></button>':'<div class="slot">'+(i+1)+'</div>'}).join('');
  return '<section><div class="eyebrow">Úloha 1 ze 2</div><div class="task-head"><h1>'+esc(introImg)+'</h1><div class="counter" id="counter">Vybráno '+S.picks.length+' z '+K+'</div></div>'
    +'<div class="img-grid">'+tiles+'</div>'
    +'<div class="task-foot"><div class="slots">'+slots+'</div><button class="btn primary big" data-go="matrix"'+(full?'':' disabled')+'>Pokračovat</button></div></section>';
}
function viewMatrix(){
  const un=ordered(srcs,S.srcOrder).filter(x=>!S.placements[x.id]),placed=Object.keys(S.placements).length;
  return '<section><div class="eyebrow">Úloha 2 ze 2</div><div class="task-head"><h1>'+esc(introMx)+'</h1><div class="counter">Umístěno '+placed+' z '+srcs.length+'</div></div>'
    +'<div class="mx-layout">'+matrixHTML()
    +'<aside class="tray" id="tray"><h2>Informační zdroje</h2><div class="tray-list">'
    +(un.length?un.map(x=>chipHTML(x,null,null,selChip===x.id)).join(''):'<p class="muted">Všechny zdroje jsou umístěny.</p>')
    +'</div><p class="muted">Zdroj přetáhněte do matice. Můžete na něj také klepnout a pak klepnout na místo v matici.</p></aside></div>'
    +'<div class="task-foot"><button class="btn big" data-go="images">Zpět na obrázky</button><button class="btn primary big" data-act="finish"'+(placed?'':' disabled')+'>Dokončit</button></div></section>';
}
function viewDone(){
  return '<section class="center"><h1>Děkujeme, hotovo.</h1>'
    +'<p class="lead">Výsledek prosím pošlete tazateli. Stáhněte soubor, nebo zkopírujte text níže a vložte ho do chatu.</p>'
    +'<div class="btns">'+(dlNS?'<button class="btn primary big" data-act="download">Stáhnout výsledek</button>':'')
    +'<button class="btn big'+(dlNS?'':' primary')+'" data-act="copy">Zkopírovat výsledek</button></div>'
    +'<textarea id="res" readonly rows="6" aria-label="Výsledek">'+esc(JSON.stringify(resultObj()))+'</textarea>'
    +'<button class="btn ghost" data-go="matrix">Zpět a upravit odpovědi</button></section>';
}
function render(){
  $('#view').innerHTML=view==='images'?viewImages():view==='matrix'?viewMatrix():view==='done'?viewDone():viewStart();
}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500)}
function go(v){view=v;selChip=null;render();window.scrollTo(0,0)}
function pick(id){
  const i=S.picks.findIndex(p=>p.id===id);
  if(i>=0)S.picks.splice(i,1);
  else if(S.picks.length<K){const im=imgs.find(x=>x.id===id);S.picks.push({id,name:im?im.name:''})}
  else{const c=$('#counter');if(c){c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash')}return}
  render();
}
function place(id,x,y){const src=srcs.find(z=>z.id===id),prev=S.placements[id];S.placements[id]={x:r3(clamp(x,.04,.96)),y:r3(clamp(y,.04,.96)),name:src?src.name:(prev?prev.name:id)};selChip=null;render()}
function unplace(id){delete S.placements[id];selChip=null;render()}
async function act(n){
  if(n==='start'){const c=$('#code');S.code=c?c.value.trim():'';go('images')}
  else if(n==='finish'){S.finishedAt=Date.now();go('done')}
  else if(n==='copy'){
    const ta=$('#res'),txt=ta.value;
    try{await navigator.clipboard.writeText(txt);toast('Zkopírováno. Vložte to do chatu.')}
    catch(e){ta.focus();ta.select();toast('Text je označený, stiskněte Ctrl+C (na Macu Cmd+C).')}
  }
  else if(n==='download'&&dlNS){
    const name='vysledek-'+(S.code||'ucastnik').replace(/[^\w-]+/g,'_')+'.json';
    try{await dlNS.save({filename:name,data:JSON.stringify(resultObj(),null,2)})}catch(e){if(!e||e.code!=='declined')toast('Soubor se nepodařilo uložit. Použijte tlačítko Zkopírovat výsledek.')}
  }
}
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#lb')){const lb=$('#lb');lb.hidden=true;lb.innerHTML='';return}
  const a=t.closest('[data-act]');if(a){act(a.dataset.act);return}
  const g=t.closest('[data-go]');if(g){if(!g.disabled)go(g.dataset.go);return}
  const z=t.closest('[data-zoom]');if(z){e.stopPropagation();const im=imgs.find(x=>x.id===z.dataset.zoom);if(im&&im.src){const lb=$('#lb');lb.innerHTML='<img src="'+esc(im.src)+'" alt="">';lb.hidden=false}return}
  const u=t.closest('[data-unpick]');if(u){pick(u.dataset.unpick);return}
  const tile=t.closest('[data-img]');if(tile){pick(tile.dataset.img);return}
  if(suppressClick)return;
  const chip=t.closest('[data-chip]');
  if(chip){const id=chip.dataset.chip;selChip=selChip===id?null:id;render();return}
  const mx=t.closest('#mx');
  if(mx&&selChip){const r=mx.getBoundingClientRect();place(selChip,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const lb=$('#lb');if(!lb.hidden){lb.hidden=true;lb.innerHTML=''}else if(selChip){selChip=null;render()}return}
  const t=e.target;
  if(t.matches&&t.matches('[data-img]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pick(t.dataset.img);return}
  if(t.matches&&t.matches('[data-chip]')){
    const id=t.dataset.chip,refocus=()=>{const n=document.querySelector('[data-chip="'+CSS.escape(id)+'"]');if(n)n.focus()};
    if(e.key==='Enter'||e.key===' '){e.preventDefault();selChip=selChip===id?null:id;render();refocus();return}
    const p=S.placements[id];
    if(p){
      const d={ArrowLeft:[-.02,0],ArrowRight:[.02,0],ArrowUp:[0,-.02],ArrowDown:[0,.02]}[e.key];
      if(d){e.preventDefault();p.x=r3(clamp(p.x+d[0],.04,.96));p.y=r3(clamp(p.y+d[1],.04,.96));render();refocus();return}
      if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();unplace(id)}
    }
  }
});
const inside=(r,x,y)=>r&&x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
document.addEventListener('pointerdown',e=>{
  if(e.button>0)return;
  const chip=e.target.closest&&e.target.closest('[data-chip]');
  if(chip)drag={id:chip.dataset.chip,el:chip,sx:e.clientX,sy:e.clientY,pid:e.pointerId,moved:false,ghost:null};
});
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  if(!drag.moved){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<7)return;
    drag.moved=true;
    const gh=drag.el.cloneNode(true);gh.classList.remove('on-mx','sel');gh.classList.add('ghost');gh.removeAttribute('data-chip');gh.removeAttribute('style');
    document.body.appendChild(gh);drag.ghost=gh;drag.el.classList.add('lifting');
  }
  drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
  const mx=$('#mx'),tr=$('#tray'),inMx=inside(mx&&mx.getBoundingClientRect(),e.clientX,e.clientY);
  if(mx)mx.classList.toggle('over',inMx);
  if(tr)tr.classList.toggle('over',!inMx&&inside(tr.getBoundingClientRect(),e.clientX,e.clientY));
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.pid)return;
  const d=drag;drag=null;if(!d.moved)return;
  d.ghost.remove();suppressClick=true;setTimeout(()=>{suppressClick=false},120);
  const mx=$('#mx'),tr=$('#tray');
  if(mx)mx.classList.remove('over');if(tr)tr.classList.remove('over');
  if(cancel){render();return}
  const mr=mx&&mx.getBoundingClientRect(),trr=tr&&tr.getBoundingClientRect();
  if(inside(mr,e.clientX,e.clientY))place(d.id,(e.clientX-mr.left)/mr.width,(e.clientY-mr.top)/mr.height);
  else if(inside(trr,e.clientX,e.clientY))unplace(d.id);
  else{selChip=null;render()}
}
window.addEventListener('pointerup',e=>endDrag(e,false));
window.addEventListener('pointercancel',e=>endDrag(e,true));
render();
(async()=>{
  const c=window.claude;
  if(c&&c.use){try{dlNS=await c.use('downloads').catch(()=>null)}catch(e){}}
  else{
    /* standalone file opened straight from disk: plain browser download */
    dlNS={save:({filename,data})=>new Promise(res=>{
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=filename;
      document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);res();
    })};
  }
  if(dlNS&&view==='done')render();
})();
})();
</script>
</body></html>
